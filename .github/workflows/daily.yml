name: Daily Editorial Update

on:
  schedule:
    - cron: '0 22 * * *' # 매일 한국시간 오전 7시 정각 실행 (UTC 22시)
  workflow_dispatch:      # 원할 때 수동으로 즉시 실행하는 버튼 활성화

permissions:
  contents: write

jobs:
  update-editorials:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 사설 수집 및 AI 분석 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update.mjs

      - name: 결과 파일 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-dataset.json
          git diff --staged --quiet || git commit -m "Auto-update editorials"
          git push
